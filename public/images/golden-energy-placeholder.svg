<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative grid pattern -->
  <g opacity="0.05">
    <path d="M0 0 L1200 0 L1200 630 L0 630 Z" fill="none" stroke="#FFD700" stroke-width="1"/>
    <line x1="0" y1="157.5" x2="1200" y2="157.5" stroke="#FFD700" stroke-width="0.5"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#FFD700" stroke-width="0.5"/>
    <line x1="0" y1="472.5" x2="1200" y2="472.5" stroke="#FFD700" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#FFD700" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#FFD700" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#FFD700" stroke-width="0.5"/>
  </g>
  
  <!-- Sun icon (simplified solar panel symbol) -->
  <g transform="translate(600, 250)">
    <!-- Sun rays -->
    <g opacity="0.4">
      <line x1="0" y1="-100" x2="0" y2="-120" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
      <line x1="70.7" y1="-70.7" x2="84.8" y2="-84.8" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
      <line x1="100" y1="0" x2="120" y2="0" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
      <line x1="70.7" y1="70.7" x2="84.8" y2="84.8" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="100" x2="0" y2="120" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
      <line x1="-70.7" y1="70.7" x2="-84.8" y2="84.8" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
      <line x1="-100" y1="0" x2="-120" y2="0" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
      <line x1="-70.7" y1="-70.7" x2="-84.8" y2="-84.8" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <!-- Sun circle -->
    <circle cx="0" cy="0" r="50" fill="url(#goldGradient)" stroke="#FFD700" stroke-width="3"/>
    
    <!-- Solar panel grid inside -->
    <rect x="-30" y="-20" width="60" height="40" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.6"/>
    <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
    <line x1="-30" y1="10" x2="30" y2="10" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
    <line x1="-20" y1="-20" x2="-20" y2="20" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
    <line x1="-10" y1="-20" x2="-10" y2="20" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
    <line x1="10" y1="-20" x2="10" y2="20" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
    <line x1="20" y1="-20" x2="20" y2="20" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Company Name -->
  <text x="600" y="420" font-family="'Montserrat', sans-serif" font-size="48" font-weight="700" fill="#FFD700" text-anchor="middle" letter-spacing="0.1em">
    GOLDEN ENERGY
  </text>
  
  <!-- Tagline -->
  <text x="600" y="460" font-family="'Montserrat', sans-serif" font-size="20" font-weight="400" fill="#B8B8B8" text-anchor="middle" letter-spacing="0.15em">
    RENEWABLE ENERGY SOLUTIONS
  </text>
  
  <!-- Website -->
  <text x="600" y="500" font-family="'Montserrat', sans-serif" font-size="18" font-weight="300" fill="#808080" text-anchor="middle">
    goldenenergy.vn
  </text>
</svg>
